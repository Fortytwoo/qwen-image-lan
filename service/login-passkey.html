<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passkey 登录 · Qwen-Image</title><style>STYLE
.key-mark{width:58px;height:58px;background:#e9f4f1;border-radius:16px;display:grid;place-items:center;margin-bottom:22px;color:#176d65}.hint{line-height:1.8;margin:18px 0 24px}.login button{width:100%}.footer{border-top:1px solid #e1e6ea;padding-top:18px;margin-top:24px;line-height:1.8}.notice{line-height:1.8;font-size:13px;color:#69747d}#message{line-height:1.7;min-height:24px}[hidden]{display:none!important}
</style></head><body><main class="panel login"><div class="key-mark" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="9" r="5"/><path d="m12 13 8 8m-4-4 3-3m-6 0 3-3"/></svg></div><h1>使用 Passkey 登录</h1><p class="small">Qwen-Image · 局域网加密服务</p><p class="hint">通过 Windows Hello、手机或安全密钥确认身份。</p><button id="passkey-login" class="primary" disabled>使用 Passkey 登录</button><p id="message" role="status" aria-live="polite">正在检查登录状态…</p><div class="footer"><p class="notice">首次设置或添加新设备，请在服务电脑运行 <strong>Register-Qwen-Passkey.cmd</strong>，或使用已登录设备提供的注册链接。</p><p class="notice">原图、提示词和结果自动加密保留。其他局域网设备首次访问需信任服务证书。</p></div></main><script>AUTH_JS
const button=$('passkey-login');
api('/auth/status').then(state=>{if(state.authenticated){location.href='/';return;}if(!supported()){message('此浏览器尚不支持 Passkey，请在 Chrome 或 Edge 中打开本页。',true);return;}button.disabled=!state.configured;message(state.configured?'点击登录，并在设备提示中完成确认。':'尚未注册 Passkey，请先完成首次设置。');}).catch(error=>message(error.message,true));
button.onclick=async()=>{button.disabled=true;message('请在设备提示中确认身份…');try{const options=await api('/auth/login/options',{method:'POST'});const credential=await navigator.credentials.get({publicKey:requestOptions(options)});await api('/auth/login/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(credentialJSON(credential))});location.href='/';}catch(error){message(friendly(error),true);}finally{button.disabled=false;}};
</script></body></html>
