<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理 Passkey · Qwen-Image</title><style>STYLE
.devices{display:grid;gap:12px;margin:20px 0}.device{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:18px;border:1px solid #e1e6ea;border-radius:12px}.device-name{font-weight:600;overflow-wrap:anywhere}.small{line-height:1.8}.device button{flex-shrink:0}.invite{background:#f4f7f8;border-radius:12px;padding:18px;margin-top:18px}.row{margin-top:18px}#message{line-height:1.8}#invite-url{margin:12px 0}label{margin-top:0}[hidden]{display:none!important}
</style></head><body><main class="wrap"><header class="bar"><div><h1>管理 Passkey</h1><div class="small">为其他设备添加通行密钥，或移除不再使用的设备。</div></div><nav class="nav"><a href="/">文生图</a><a href="/edit">改图</a><a href="/history">历史记录</a><button id="logout">退出登录</button></nav></header><section class="panel"><div class="row"><a class="button" href="/register">在此设备添加 Passkey</a><button id="invite" class="primary">生成其他设备注册链接</button></div><p class="small">注册链接 10 分钟内有效，只能使用一次。获得链接并完成设备验证的人可访问本服务的全部历史记录。</p><div id="invitation" class="invite" hidden><label for="invite-url">将此注册链接提供给需要访问的设备</label><input id="invite-url" readonly><div class="row"><button id="copy">复制注册链接</button><span id="expires" class="small"></span></div></div><p id="message" role="status" aria-live="polite"></p><div id="devices" class="devices"></div></section></main><script>AUTH_JS
function node(tag,text,className){const element=document.createElement(tag);if(text!=null)element.textContent=text;if(className)element.className=className;return element;}
async function refresh(){const result=await api('/auth/passkeys');$('devices').replaceChildren();for(const item of result.credentials){const card=node('article',null,'device');const body=node('div');body.append(node('div',item.label+(item.id===result.current?' · 当前设备':''),'device-name'));body.append(node('div','创建于 '+new Date(item.created*1000).toLocaleString('zh-CN')+' · 最近使用 '+new Date(item.last_used*1000).toLocaleString('zh-CN'),'small'));const button=node('button','移除');button.disabled=result.credentials.length<=1;button.onclick=async()=>{if(!confirm('移除这把 Passkey 后，该设备将不能再用它登录。确定移除？'))return;try{await api('/auth/passkeys/'+encodeURIComponent(item.id)+'/revoke',{method:'POST'});if(item.id===result.current){location.href='/login';return;}await refresh();message('已移除。');}catch(error){message(error.message,true);}};card.append(body,button);$('devices').append(card);}}
$('invite').onclick=async()=>{try{const result=await api('/auth/enrollment',{method:'POST'});$('invitation').hidden=false;$('invite-url').value=result.url;$('expires').textContent='有效至 '+new Date(result.expires*1000).toLocaleTimeString('zh-CN');message('注册链接已生成。');}catch(error){message(error.message,true);}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('invite-url').value);message('注册链接已复制。');}catch(error){$('invite-url').select();message('请手动复制已选中的注册链接。');}};$('logout').onclick=logout;api('/session').then(session=>{csrf=session.csrf;return refresh();}).catch(error=>message(error.message,true));
</script></body></html>
