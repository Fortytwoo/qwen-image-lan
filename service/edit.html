<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参考图改图 · Qwen-Image</title>
<style>STYLE
.upload{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #cad3da;border-radius:9px;padding:12px}.upload #file-name{overflow-wrap:anywhere}textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #cad3da;border-radius:9px;background:white}textarea{min-height:130px;resize:vertical;line-height:1.6}fieldset{border:0;padding:0;margin:0;min-width:0}.edit-layout{display:grid;grid-template-columns:380px 1fr;gap:22px}.canvases{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.canvas{border:1px solid #e1e6ea;border-radius:12px;padding:14px;min-width:0}.canvas img{display:block;width:100%;max-height:560px;object-fit:contain;background:#f4f6f8;border-radius:8px}.empty{padding:70px 14px;text-align:center;color:#69747d;background:#f4f6f8;border-radius:8px}.dimensions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#69747d;font-size:13px;line-height:1.7}.download{display:inline-block;margin-top:12px}#status{min-height:24px;line-height:1.6;margin:16px 0}.error{color:#a12626}#submit{width:100%;margin-top:20px}button:disabled{opacity:.6;cursor:wait}.nav{flex-wrap:wrap}.canvas h2{font-size:15px}[hidden]{display:none!important}@media(max-width:1000px){.edit-layout{grid-template-columns:1fr}.canvases{grid-template-columns:1fr 1fr}}@media(max-width:600px){.canvases{grid-template-columns:1fr}.panel{padding:18px}.wrap{margin:18px auto}.empty{padding:40px 12px}}
</style></head>
<body><main class="wrap"><header class="bar"><div><h1>参考图改图</h1><div class="small">上传一张图片，描述需要修改的内容。</div></div><nav class="nav"><a href="/">文生图</a><a href="/history">历史记录</a><a href="/passkeys">Passkey</a><button id="logout">退出登录</button></nav></header>
<div class="edit-layout"><section class="panel"><form id="edit-form"><fieldset id="fields"><label for="reference">原图</label><div class="upload"><button type="button" id="choose">选择图片</button><span id="file-name" class="muted">未选择图片</span><input id="reference" type="file" accept="image/png,image/jpeg,image/webp" hidden></div><p class="muted">PNG、JPEG、WebP，单张不超过 8 MB。原文件完整加密保存；模型参考图最长边自动缩至 1024。</p>
<label for="prompt">修改指令</label><textarea id="prompt" maxlength="12000" placeholder="例如：把小机器人的橙色外壳改成蓝色，保持姿势、背景和构图。" required></textarea><p class="muted">说明要修改什么、需要保留什么。整张图片会重新生成。</p>
<div class="dimensions"><div><label for="width">输出宽度</label><select id="width"></select></div><div><label for="height">输出高度</label><select id="height"></select></div></div>
<button id="submit" type="submit" class="primary">开始改图</button></fieldset><p id="status" role="status" aria-live="polite">选择原图后即可开始。</p></form><p class="muted">HTTPS 传输。原图、修改指令、参数和产出在本机加密归档；关闭网页后仍会保存已提交任务。</p></section>
<section class="canvases" aria-label="改图预览"><div class="canvas"><h2>上传原图</h2><div id="source-empty" class="empty">原图预览</div><img id="source" alt="上传原图" hidden><p id="source-info" class="muted"></p><a id="source-download" class="download" hidden>下载原图</a></div><div class="canvas"><h2>修改结果</h2><div id="result-empty" class="empty">生成完成后显示结果</div><img id="result" alt="修改结果" hidden><p id="result-info" class="muted"></p><a id="result-download" class="download" hidden>下载结果</a></div></section></div></main>
<script>
let csrf='',reference='',busy=false;
const $=id=>document.getElementById(id);
for(const id of ['width','height'])for(let size=256;size<=1024;size+=32){const option=document.createElement('option');option.value=size;option.textContent=size;$(id).append(option);} $('width').value=1024;$('height').value=1024;
function status(text,error=false){$('status').textContent=text;$('status').className=error?'error':'';}
async function api(url,options={}){const response=await fetch(url,{...options,headers:{...options.headers,'X-Qwen-CSRF':csrf}});if(response.status===401){location.href='/login';throw new Error('请重新登录。');}const data=await response.json();if(!response.ok)throw new Error(data.detail||'请求失败，请稍后重试。');return data;}
const ready=api('/session').then(session=>{csrf=session.csrf;});
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function dataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('无法读取图片。'));reader.readAsDataURL(blob);});}
async function setReference(blob){if(blob.size>8*1024*1024)throw new Error('参考图片不能超过 8 MB。');const encoded=await dataUrl(blob);const image=new Image();image.src=encoded;await image.decode();if(Math.min(image.naturalWidth,image.naturalHeight)<32||Math.max(image.naturalWidth,image.naturalHeight)>8192||image.naturalWidth*image.naturalHeight>16*1024*1024)throw new Error('原图边长需为 32 至 8192 像素，总像素不超过 1600 万。');reference=encoded;$('source').src=encoded;$('source').hidden=false;$('source-empty').hidden=true;const scale=Math.min(1,1024/Math.max(image.naturalWidth,image.naturalHeight));for(const [id,size] of [['width',image.naturalWidth],['height',image.naturalHeight]])$(id).value=Math.max(256,Math.min(1024,Math.round(size*scale/32)*32));$('source-info').textContent=`${image.naturalWidth} × ${image.naturalHeight} · ${(blob.size/1024/1024).toFixed(2)} MB`;$('source-download').hidden=true;status('原图已就绪，请填写修改指令。');}
$('choose').onclick=()=>$('reference').click();
$('reference').onchange=async()=>{reference='';$('file-name').textContent=$('reference').files[0]?.name||'未选择图片';$('source-info').textContent='';$('source').hidden=true;$('source-empty').hidden=false;try{if($('reference').files[0])await setReference($('reference').files[0]);else status('请选择原图。');}catch(error){status(error.message,true);}};
$('edit-form').onsubmit=async event=>{event.preventDefault();if(busy)return;if(!reference){status('请先选择原图。',true);return;}await ready;busy=true;$('fields').disabled=true;$('result').hidden=true;$('result-download').hidden=true;$('result-empty').hidden=false;status('正在提交改图任务…');try{const job=await api('/sdcpp/v1/img_gen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:$('prompt').value.trim(),ref_images:[reference],width:Number($('width').value),height:Number($('height').value),seed:-1,batch_count:1,output_format:'png',vae_tiling_params:{enabled:true}})});for(;;){const snapshot=await api('/sdcpp/v1/jobs/'+encodeURIComponent(job.id));if(snapshot.status==='completed'){const encoded=snapshot.result.images[0].b64_json;const url='data:image/png;base64,'+encoded;$('result').src=url;$('result').hidden=false;$('result-empty').hidden=true;$('result-download').href=url;$('result-download').download='qwen-edit-'+job.id+'.png';$('result-download').hidden=false;$('result-info').textContent=$('width').value+' × '+$('height').value;status('改图完成。原图、指令和结果已加密保存到历史记录。');break;}if(['failed','cancelled'].includes(snapshot.status))throw new Error(typeof snapshot.error==='string'?snapshot.error:(snapshot.error?.message||'改图任务未完成，请查看历史记录。'));status(snapshot.status==='queued'?'排队中，关闭页面后仍会继续。':'正在改图，关闭页面后仍会保存结果。');await sleep(2000);}}catch(error){status(error.message,true);}finally{busy=false;$('fields').disabled=false;}};
$('logout').onclick=async()=>{await ready;await api('/logout',{method:'POST'});location.href='/login';};
(async()=>{try{await ready;const id=new URLSearchParams(location.search).get('record');if(!id)return;if(!/^[a-f0-9]{32}$/.test(id))throw new Error('历史记录编号不正确。');const response=await fetch('/archive/records/'+id+'/images/0');if(!response.ok)throw new Error('无法读取历史图片。');await setReference(await response.blob());$('file-name').textContent='历史结果图片';}catch(error){status(error.message,true);}})();
</script></body></html>
