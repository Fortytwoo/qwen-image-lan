<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创建 Passkey · Qwen-Image</title><style>STYLE
.hint{line-height:1.8}.login button{width:100%;margin-top:22px}.footer{margin-top:22px;line-height:1.8}#message{line-height:1.7;min-height:24px}
</style></head><body><main class="panel login"><h1>创建 Passkey</h1><p class="small">Qwen-Image · 局域网加密服务</p><p class="hint">请选择保存方式，并在 Windows Hello、手机或安全密钥上完成确认。</p><label for="label">设备名称</label><input id="label" maxlength="64" value="这台电脑" autocomplete="off"><button id="create-passkey" class="primary" disabled>创建 Passkey</button><p id="message" role="status" aria-live="polite">正在检查注册链接…</p><p class="small hint">服务只保存公钥。指纹、PIN 和 Passkey 私钥由设备或你选择的 Passkey 提供方管理。</p><div class="footer"><a href="/login">返回登录</a></div></main><script>AUTH_JS
const button=$('create-passkey');const grant=new URLSearchParams(location.hash.slice(1)).get('enroll');if(grant)history.replaceState(null,'',location.pathname);
api('/auth/status').then(async state=>{if(!supported())throw new Error('此浏览器不支持 Passkey，请在 Chrome 或 Edge 中打开注册链接。');if(!grant&&!state.authenticated)throw new Error('需要有效注册链接。请在服务电脑运行 Register-Qwen-Passkey.cmd。');if(state.authenticated)csrf=(await api('/session')).csrf;button.disabled=false;message('点击创建，并在设备提示中完成确认。');}).catch(error=>message(error.message,true));
button.onclick=async()=>{button.disabled=true;message('请在设备提示中创建 Passkey…');try{const options=await api('/auth/register/options',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enrollment_token:grant,label:$('label').value.trim()})});const credential=await navigator.credentials.create({publicKey:creationOptions(options)});await api('/auth/register/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(credentialJSON(credential))});message('Passkey 已创建，正在打开生图界面…');location.href='/';}catch(error){message(friendly(error),true);}finally{button.disabled=false;}};
</script></body></html>
